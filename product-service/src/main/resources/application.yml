spring:
  application:
    name: product-service
  jpa:
    show-sql: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true